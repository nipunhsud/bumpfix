name: free-audit
on:
  issues:
    types: [opened, reopened]
permissions:
  issues: write
  contents: read
concurrency:
  group: free-audit
  cancel-in-progress: false
jobs:
  audit:
    if: contains(github.event.issue.title, '[audit]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.SERVICE_PAT }}
      ISSUE: ${{ github.event.issue.number }}
      AUTHOR: ${{ github.event.issue.user.login }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Parse and validate request
        id: req
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          say() { GH_TOKEN=${{ github.token }} gh issue comment "$ISSUE" -R "${{ github.repository }}" -b "$1"; }
          REPO=$(printf '%s\n%s' "$TITLE" "$BODY" | grep -oE '[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+' | grep -v '^OWNER/REPO$' | head -1)
          [ -n "$REPO" ] || { say "Couldn't find an owner/name repo in the request."; exit 1; }
          OWNER=${REPO%%/*}
          if [ "$OWNER" != "$AUTHOR" ]; then
            say "This free service only audits repos you own (requested \`$REPO\`, you are \`$AUTHOR\`)."
            exit 1
          fi
          gh api "repos/$REPO" --jq .private | grep -q false || { say "Public repos only."; exit 1; }
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          TEST=$(printf '%s' "$BODY" | awk '/Test command/{f=1;next} f&&NF{print;exit}' | tr -d '\r')
          echo "test=$TEST" >> "$GITHUB_OUTPUT"
      - name: Audit (probe mode, no agent, red never ships)
        run: |
          set +e
          REPO="${{ steps.req.outputs.repo }}"
          NAME=${REPO##*/}
          git clone -q "https://github.com/$REPO.git" target
          cd target || exit 1
          git config user.name "bumpwright"
          git config user.email "bumpwright[bot]@users.noreply.github.com"
          if [ -f pnpm-lock.yaml ]; then corepack enable 2>/dev/null; pnpm install --frozen-lockfile || pnpm install
          elif [ -f package.json ]; then npm ci || npm install
          fi
          T="${{ steps.req.outputs.test }}"
          if [ -n "$T" ]; then node ../bin/bumpwright.js audit --max-iters 0 --test "$T" > ../audit.log 2>&1
          else node ../bin/bumpwright.js audit --max-iters 0 > ../audit.log 2>&1
          fi
          node ../bin/bumpwright.js fix >> ../audit.log 2>&1
          gh repo fork "$REPO" --clone=false 2>/dev/null; sleep 5
          FORK_OWNER=$(gh api user --jq .login)
          PRS=""
          for B in $(git branch --list 'bumpwright/*' --format='%(refname:short)'); do
            [ "$(git rev-list --count origin/HEAD..$B 2>/dev/null)" -gt 0 ] || continue
            git push -q "https://github.com/$FORK_OWNER/$NAME.git" "$B" || continue
            PRBODY=$(printf '%s\n\n%s\n\n%s' \
              "$(git log $B -1 --pretty=%b)" \
              "Opened by the free [bumpwright](https://github.com/nipunhsud/bumpwright) audit service at your request (nipunhsud/bumpwright#$ISSUE). Probe mode: version bumped, your own tests ran green, no AI code edits. Review like any PR." \
              "🤖 Generated with [Claude Code](https://claude.com/claude-code)")
            URL=$(gh pr create --repo "$REPO" --head "$FORK_OWNER:$B" --title "$(git log $B -1 --pretty=%s)" --body "$PRBODY" 2>/dev/null)
            [ -n "$URL" ] && PRS=$(printf '%s\n- %s' "$PRS" "$URL")
          done
          SUMMARY=$(grep -E "no vulnerabilities|fixable without|downgrade|transitive|already red|committed upgrade|committed npm audit fix|safely change" ../audit.log | sort -u | head -10 | sed 's/^/> /')
          OUT=$(printf '**bumpwright free audit of `%s`**\n\n%s\n' "$REPO" "${SUMMARY:-'> (no findings output)'}")
          [ -n "$PRS" ] && OUT=$(printf '%s\n**Green upgrade PRs opened:**%s\n' "$OUT" "$PRS")
          OUT=$(printf '%s\nRed results need real migration work — run `bumpwright <pkg>` locally with an agent for those.' "$OUT")
          GH_TOKEN=${{ github.token }} gh issue comment "$ISSUE" -R "${{ github.repository }}" -b "$OUT"
