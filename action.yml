name: Bumpwright Upgrade Agent
description: Upgrade a dependency and migrate breaking changes behind your test gate, then open a green PR
branding: { icon: git-pull-request, color: green }
inputs:
  package:
    description: Package to upgrade, e.g. react@19 (version optional)
    required: true
  test:
    description: Test command gate (default = auto; npm test, or the build script if no tests)
    required: false
    default: ""
  max-iters:
    description: Max agent fix attempts
    required: false
    default: "3"
  workspaces:
    description: Also bump the package in every workspace subpackage ("true"/"false")
    required: false
    default: "false"
  anthropic-api-key:
    description: API key for the default Claude Code agent (not needed with max-iters 0)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install bumpwright and Claude Code
      shell: bash
      run: npm install -g github:nipunhsud/bumpwright#v0.4.0 @anthropic-ai/claude-code
    - name: Configure git identity
      shell: bash
      run: |
        git config user.name "bumpwright"
        git config user.email "bumpwright[bot]@users.noreply.github.com"
    - name: Upgrade and migrate
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
      run: |
        ARGS=(--max-iters "${{ inputs.max-iters }}" --pr)
        [ -n "${{ inputs.test }}" ] && ARGS+=(--test "${{ inputs.test }}")
        [ "${{ inputs.workspaces }}" = "true" ] && ARGS+=(--workspaces)
        bumpwright "${{ inputs.package }}" "${ARGS[@]}"
